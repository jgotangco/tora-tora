name: Unpack images

on:
  push:
    paths:
      - "**/*.b64"
      - ".github/workflows/unpack-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image sidecars
        run: |
          set -eu
          shopt -s globstar nullglob
          n=0
          for f in **/*.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            git add -- "$out"
            n=$((n + 1))
          done
          echo "decoded $n"
          if git diff --cached --quiet; then
            echo "No new images."
            exit 0
          fi
          git -c user.name="jgotangco" -c user.email="8622+jgotangco@users.noreply.github.com" commit -m "Add screenshots and image assets"
          git push origin HEAD:main
