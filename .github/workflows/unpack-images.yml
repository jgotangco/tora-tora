name: Unpack images

on:
  push:
    paths:
      - "docs/parts/art-*"
      - ".github/workflows/unpack-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble key art
        run: |
          set -eu
          shopt -s nullglob
          parts=(docs/parts/art-*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "no parts"
            exit 0
          fi
          cat "${parts[@]}" | tr -d '[:space:]' > /tmp/key.b64
          if ! base64 -d /tmp/key.b64 > docs/keyart.jpg.tmp; then
            echo "decode failed"
            exit 1
          fi
          got=$(sha256sum docs/keyart.jpg.tmp | awk '{print $1}')
          want=9640894ca2a8953d632c140be79cda7a90d0aa5c9687192f38be3450157570a6
          echo "hash $got"
          if [ "$got" != "$want" ]; then
            echo "hash mismatch"
            exit 1
          fi
          mv docs/keyart.jpg.tmp docs/keyart.jpg
          git add -- docs/keyart.jpg
          if git diff --cached --quiet; then
            echo "unchanged"
            exit 0
          fi
          git -c user.name="jgotangco" -c user.email="8622+jgotangco@users.noreply.github.com" commit -m "Add the key art."
          git push origin HEAD:main
