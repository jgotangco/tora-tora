name: Unpack images

on:
  push:
    paths:
      - "**/*.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image sidecars
        run: |
          set -eu
          shopt -s globstar nullglob
          for f in **/*.b64; do
            base64 -d "$f" > "${f%.b64}"
          done
          git config user.name "jgotangco"
          git config user.email "8622+jgotangco@users.noreply.github.com"
          git add -A -- "**/*.png" "**/*.jpg" "**/*.jpeg"
          if git diff --cached --quiet; then
            echo "No new images."
            exit 0
          fi
          git commit -m "Add screenshots and image assets"
          git push
